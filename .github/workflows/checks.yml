name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Brain regressions and UI syntax
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python atticus.py --selftest
      - name: App builds and passes its selftest
        run: |
          dotnet build win/Atticus -c Release -o out
          out/Atticus.exe --selftest
      - name: Installer syntax
        shell: pwsh
        run: |
          $e = $null
          foreach ($f in 'build.ps1', 'install.ps1') { $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e); if ($e) { $e; exit 1 } }
